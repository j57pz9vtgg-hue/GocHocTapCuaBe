<svg xmlns="http://www.w3.org/2000/svg" width="390" height="54" viewBox="0 0 390 54"><title>5, chỗ điền dấu, 3, chỗ điền dấu, 2, chỗ điền dấu, 4 bằng 6</title><rect width="100%" height="100%" fill="white"/><text x="195" y="36" text-anchor="middle" font-family="Times New Roman,serif" font-size="26" fill="black">5 __ 3 __ 2 __ 4 = 6</text></svg>