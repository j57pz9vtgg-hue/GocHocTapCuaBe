<svg xmlns="http://www.w3.org/2000/svg" width="390" height="58" viewBox="0 0 390 58" role="img"><title>4, chỗ điền dấu, 5, chỗ điền dấu, 3, chỗ điền dấu, 6 bằng 12</title><rect width="100%" height="100%" fill="white"/><text x="195" y="39" text-anchor="middle" font-family="Times New Roman,serif" font-size="27" font-weight="bold" fill="#000">4 __ 5 __ 3 __ 6 = 12</text></svg>